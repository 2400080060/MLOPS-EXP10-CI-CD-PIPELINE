name: MLOps CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      MODEL_VERSION: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Train machine learning model
        run: python train.py

      - name: Save model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-model-${{ github.run_number }}
          path: artifacts/iris_model.joblib

      # Optional deployment trigger. Add DEPLOY_HOOK_URL under
      # GitHub Settings > Secrets and variables > Actions > New repository secret.
      - name: Trigger deployment (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
            echo "Deployment hook triggered."
          else
            echo "DEPLOY_HOOK_URL not configured; deployment step skipped."
          fi
